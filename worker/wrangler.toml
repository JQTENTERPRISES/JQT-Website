# jqt-lead: lead capture for jqtenterprises.com. See ../DEPLOY.md "Lead capture".
name = "jqt-lead"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "jqtenterprises.com/api/*", zone_name = "jqtenterprises.com" },
]

[vars]
SITE_ORIGIN = "https://jqtenterprises.com"
FROM_ADDR = "leads@jqtenterprises.com"
NOTIFY_TO = "jqtenterprisesllc@gmail.com"

# Mail to the inbox. Cloudflare only delivers to a VERIFIED Email Routing
# destination, which is what makes this binding safe: it cannot mail anyone else.
[[send_email]]
name = "NOTIFY"
destination_address = "jqtenterprisesllc@gmail.com"

# Six submissions a minute per IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

[observability]
enabled = true

# Secret, never committed:  npx wrangler secret put ATTIO_TOKEN
